    {/* Left Curved Tine */}
    <path d="M49,36 C41,35 32.5,30 36,15 C37,11 41,11 41,13 C41,15 38.5,17 38.5,21 C38.5,28 45.5,32 49,32 Z" />
    
    {/* Right Curved Tine */}
